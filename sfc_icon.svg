<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Subtle concentric decorative rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#A855F7" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Central Document Card -->
  <path d="M 180 140 L 290 140 L 340 190 L 340 370 C 340 382 330 392 318 392 L 180 392 C 168 392 158 382 158 370 L 158 162 C 158 150 168 140 180 140 Z" fill="#1E293B" stroke="#334155" stroke-width="3" />
  <!-- Corner fold -->
  <path d="M 290 140 L 290 190 L 340 190 Z" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="2" />

  <!-- Top Cyan Arrow (Clockwise arc) -->
  <path d="M 170 200 C 180 160 215 130 256 130 C 275 130 292 137 305 148 L 305 125 L 335 155 L 290 175 L 300 160 C 288 150 273 145 256 145 C 225 145 198 168 190 198 Z" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- Bottom Purple Arrow (Clockwise return arc) -->
  <path d="M 342 312 C 332 352 297 382 256 382 C 237 382 220 375 207 364 L 207 387 L 177 357 L 222 337 L 212 352 C 224 362 239 367 256 367 C 287 367 314 344 322 314 Z" fill="url(#purpleGrad)" filter="url(#glow)" />

  <!-- SFC Monogram Pill in center of doc -->
  <rect x="185" y="225" width="142" height="62" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-width="2.5" />
  <text x="256" y="268" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SFC</text>

  <!-- Subtitle pill badge -->
  <text x="256" y="325" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#38BDF8" text-anchor="middle" letter-spacing="3">CONVERTER</text>
</svg>
